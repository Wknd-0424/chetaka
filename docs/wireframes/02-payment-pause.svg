<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 760" width="380" height="760" font-family="Segoe UI, Roboto, sans-serif">
  <rect width="380" height="760" rx="34" fill="#0E1116"/>
  <rect x="8" y="8" width="364" height="744" rx="28" fill="#F4F7FA"/>
  <text x="26" y="42" fill="#6B7684" font-size="12" font-family="Consolas, monospace">09:58</text>

  <text x="190" y="92" fill="#6B7684" font-size="13" text-anchor="middle">You just opened a payment app</text>

  <rect x="24" y="116" width="332" height="196" rx="20" fill="#FFFFFF" stroke="#DCE4EC"/>
  <circle cx="190" cy="168" r="24" fill="#FEF1F0"/>
  <rect x="183" y="159" width="5" height="19" rx="2" fill="#D22B20"/>
  <rect x="192" y="159" width="5" height="19" rx="2" fill="#D22B20"/>
  <text x="190" y="222" fill="#101418" font-size="24" font-weight="700" text-anchor="middle">Wait 10 seconds</text>
  <text x="190" y="250" fill="#5A6675" font-size="15" text-anchor="middle">You were on a suspicious call</text>
  <text x="190" y="272" fill="#5A6675" font-size="15" text-anchor="middle">2 minutes ago.</text>
  <text x="190" y="296" fill="#8B96A4" font-size="13" text-anchor="middle">Scammers rush you. Chetaka does not.</text>

  <circle cx="190" cy="392" r="52" fill="none" stroke="#E3E9F0" stroke-width="10"/>
  <circle cx="190" cy="392" r="52" fill="none" stroke="#D22B20" stroke-width="10"
          stroke-dasharray="196 331" stroke-linecap="round" transform="rotate(-90 190 392)"/>
  <text x="190" y="404" fill="#101418" font-size="30" font-weight="700" text-anchor="middle">6</text>

  <rect x="24" y="478" width="332" height="112" rx="18" fill="#EAF3FA" stroke="#BEDCF0"/>
  <text x="46" y="508" fill="#1580C4" font-size="11" font-family="Consolas, monospace">WHY THIS APPEARED</text>
  <text x="46" y="534" fill="#2C3642" font-size="14">Unknown caller &#183; 14 min call</text>
  <text x="46" y="558" fill="#2C3642" font-size="14">Bank app opened right after</text>
  <text x="46" y="578" fill="#6B7684" font-size="12">No call recording was needed for this check.</text>

  <rect x="24" y="612" width="332" height="56" rx="16" fill="#101418"/>
  <text x="190" y="647" fill="#FFFFFF" font-size="16" font-weight="600" text-anchor="middle">Call my son first</text>

  <text x="190" y="700" fill="#8B96A4" font-size="14" text-anchor="middle" text-decoration="underline">Skip &#8212; I know this person</text>
  <text x="190" y="722" fill="#A6B0BC" font-size="11" text-anchor="middle">Skips are logged so the guard improves</text>
</svg>
